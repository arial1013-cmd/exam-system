<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳解檢視 - 歷屆試題詳解系統</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="kicker" id="kicker">歷屆試題詳解系統</div>
    <h1 id="examTitle">載入中…</h1>
    <div class="meta" id="examMeta"></div>
    <a class="backlink" href="index.html">← 回考卷清單</a>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <button class="primary" onclick="setAll(true)">全部展開詳解</button>
    <button onclick="setAll(false)">全部收合</button>
    <button onclick="window.print()">列印 / 存成PDF</button>
    <a class="btn" id="practiceLink" href="#">切換到練習模式</a>
  </div>

  <div id="questionList"><div class="empty-note">載入中…</div></div>

  <div class="note" id="footNote"></div>
</div>

<script>
function getExamId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('exam');
}

async function init(){
  const examId = getExamId();
  const listEl = document.getElementById('questionList');
  if(!examId){
    listEl.innerHTML = '<div class="empty-note">網址缺少 exam 參數，請從 <a href="index.html">考卷清單</a> 進入。</div>';
    return;
  }
  document.getElementById('practiceLink').href = 'practice.html?exam=' + encodeURIComponent(examId);

  try{
    const manifestRes = await fetch('manifest.json');
    const manifest = await manifestRes.json();
    const examMeta = (manifest.exams || []).find(function(e){ return e.id === examId; });
    if(!examMeta){
      listEl.innerHTML = '<div class="empty-note">找不到考卷「' + examId + '」，請確認manifest.json中有登記。</div>';
      return;
    }
    const dataRes = await fetch(examMeta.dataFile);
    const examData = await dataRes.json();
    renderExam(examMeta, examData);
  }catch(err){
    listEl.innerHTML = '<div class="empty-note">' +
      '載入考卷資料失敗。若是直接用瀏覽器打開檔案（file://），瀏覽器會擋掉JSON讀取，' +
      '請部署到網頁伺服器（例如GitHub Pages）後再開啟。</div>';
    console.error(err);
  }
}

function renderExam(examMeta, examData){
  const info = examData.examInfo || {};
  document.title = (info.title || examMeta.title) + ' 詳解';
  document.getElementById('kicker').textContent =
    (info.year||examMeta.year) + '學年度・' + (info.group||examMeta.group||'');
  document.getElementById('examTitle').textContent =
    (info.subject||examMeta.subject) + '（' + (info.code||examMeta.code||'') + '）詳解講義';
  document.getElementById('examMeta').textContent =
    '共 ' + examData.questions.length + ' 題單選題，每題 ' + (info.pointsPerQuestion||5) + ' 分';

  const optionLabels = ['A','B','C','D'];
  let html = '';
  examData.questions.forEach(function(q){
    const qid = 'q' + q.id;
    html += '<div class="qcard" id="' + qid + '">';
    html += '  <div class="qhead" onclick="toggle(\'' + qid + '\')">';
    html += '    <div class="qnum">' + String(q.id).padStart(2,'0') + '</div>';
    html += '    <div class="qbody">';
    html += '      <div class="qtext">' + q.text + '</div>';
    html += '      <div class="options">';
    optionLabels.forEach(function(label){
      if(q.options[label] !== undefined){
        html += '<div>(' + label + ') ' + q.options[label] + '</div>';
      }
    });
    html += '      </div></div>';
    html += '    <div class="ans-badge">' + q.answer + '</div>';
    html += '  </div>';
    html += '  <div class="solution">';
    html += '    <div class="label">詳解</div>';
    html += '    <ul class="steps">';
    (q.steps||[]).forEach(function(step){
      html += '<li>' + step + '</li>';
    });
    html += '    </ul>';
    if(q.final){
      html += '    <div class="final">' + q.final + '</div>';
    }
    html += '  </div>';
    html += '</div>';
  });
  document.getElementById('questionList').innerHTML = html;

  document.getElementById('footNote').textContent =
    '此份詳解對應「' + (info.title||examMeta.title) + '」，共' + examData.questions.length +
    '題。點擊題目可展開/收合詳解，適合作為考前複習或個別指導教材。';
}

function toggle(id){
  document.getElementById(id).classList.toggle('open');
}
function setAll(open){
  document.querySelectorAll('.qcard').forEach(function(c){
    c.classList.toggle('open', open);
  });
}

init();
</script>

</body>
</html>
