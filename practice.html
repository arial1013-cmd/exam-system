<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練習模式 - 歷屆試題詳解系統</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="kicker" id="kicker">歷屆試題詳解系統・練習模式</div>
    <h1 id="examTitle">載入中…</h1>
    <div class="meta" id="examMeta"></div>
    <a class="backlink" href="index.html">← 回考卷清單</a>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <a class="btn" id="viewerLink" href="#">切換到詳解模式</a>
    <button onclick="resetProgress()">清除作答紀錄，重新開始</button>
  </div>

  <div id="modeChoice" style="display:none;" class="note">
    <div style="margin-bottom:12px; font-weight:700;">這份考卷要怎麼作答？</div>
    <div class="controls" style="margin:0;">
      <button class="primary" onclick="chooseMode('immediate')">每題作答後立即看詳解</button>
      <button class="primary" onclick="chooseMode('end')">全部作答完再一起對答案</button>
    </div>
  </div>

  <div id="questionList"><div class="empty-note">載入中…</div></div>

  <footer class="site-footer">
    教材製作／詳解撰寫：新竹市立成德高中 杜昀蓁<br>
    © 2026 版權所有，僅供教學使用，未經同意請勿轉載
  </footer>
</div>

<div class="summary-bar" id="summaryBar" style="display:none;">
  <div class="score" id="scoreText">已作答 0 / 0</div>
  <div id="scoreDetail" style="display:flex; align-items:center; gap:12px;">
    <span id="scoreDetailText">正確 0 題</span>
    <button id="submitBtn" style="display:none;" onclick="submitExam()">交卷對答案</button>
  </div>
</div>

<script src="shared/notes.js"></script>
<script src="shared/render.js"></script>
<script>
let examId, examData, progress = { mode: null, submitted: false, answers: {} };

function getExamId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('exam');
}
function storageKey(){ return 'examPractice_' + examId; }

function loadProgress(){
  try{
    const raw = localStorage.getItem(storageKey());
    const parsed = raw ? JSON.parse(raw) : null;
    if(parsed && parsed.answers){
      progress = parsed;
    }else if(parsed){
      // legacy format from earlier version: flat {qid: {selected, correct}}
      progress = { mode: 'immediate', submitted: true, answers: parsed };
    }else{
      progress = { mode: null, submitted: false, answers: {} };
    }
  }catch(e){ progress = { mode: null, submitted: false, answers: {} }; }
}
function saveProgress(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(progress)); }catch(e){}
}
function resetProgress(){
  if(!confirm('確定要清除這份考卷的作答紀錄嗎？此動作無法復原。')) return;
  progress = { mode: null, submitted: false, answers: {} };
  saveProgress();
  renderExam(window._examMeta, examData);
}

async function init(){
  examId = getExamId();
  const listEl = document.getElementById('questionList');
  if(!examId){
    listEl.innerHTML = '<div class="empty-note">網址缺少 exam 參數，請從 <a href="index.html">考卷清單</a> 進入。</div>';
    return;
  }
  document.getElementById('viewerLink').href = 'viewer.html?exam=' + encodeURIComponent(examId);
  loadProgress();
  initNotesFor(examId);

  try{
    const manifestRes = await fetch('manifest.json');
    const manifest = await manifestRes.json();
    const examMeta = (manifest.exams || []).find(function(e){ return e.id === examId; });
    if(!examMeta){
      listEl.innerHTML = '<div class="empty-note">找不到考卷「' + examId + '」，請確認manifest.json中有登記。</div>';
      return;
    }
    window._examMeta = examMeta;
    const dataRes = await fetch(examMeta.dataFile);
    examData = await dataRes.json();
    renderExam(examMeta, examData);
  }catch(err){
    listEl.innerHTML = '<div class="empty-note">' +
      '載入考卷資料失敗。若是直接用瀏覽器打開檔案（file://），瀏覽器會擋掉JSON讀取，' +
      '請部署到網頁伺服器（例如GitHub Pages）後再開啟。</div>';
    console.error(err);
  }
}

function chooseMode(mode){
  progress.mode = mode;
  saveProgress();
  renderExam(window._examMeta, examData);
}

function findQ(qid){ return examData.questions.find(function(x){ return x.id === qid; }); }
function gradable(data){ return data.questions.filter(function(q){ return qType(q) !== 'open'; }); }
function sortedLetters(str){ return str.split('').sort().join(''); }
function ansText(q){
  if(qType(q) === 'fill') return fillAnsText(q);
  return q.answer.split('').map(function(c){ return '(' + c + ')'; }).join('');
}
function objLabel(data){ return data.questions.some(function(q){ return qType(q) === 'fill'; }) ? '選擇（填）題' : '選擇題'; }

function isRevealed(q){
  if(progress.submitted) return true;
  const a = progress.answers[q.id];
  if(progress.mode !== 'immediate' || !a) return false;
  if(qType(q) === 'open') return !!a.revealed;
  if(qType(q) === 'multi' || qType(q) === 'fill') return a.confirmed === true;
  return true;
}

function renderExam(examMeta, data){
  const info = data.examInfo || {};
  document.title = (info.title || examMeta.title) + ' 練習';
  document.getElementById('kicker').textContent =
    (info.year||examMeta.year) + '學年度・' + (info.group||examMeta.group||'') + '・練習模式';
  const codePart = (info.code||examMeta.code) ? '（' + (info.code||examMeta.code) + '）' : '';
  document.getElementById('examTitle').textContent = (info.subject||examMeta.subject) + codePart + '練習';

  const modeChoiceEl = document.getElementById('modeChoice');
  const listEl = document.getElementById('questionList');
  const nOpen = data.questions.length - gradable(data).length;
  const countText = '共 ' + data.questions.length + ' 題' + (nOpen ? '（含 ' + nOpen + ' 題非選擇題，自行對照參考答案）' : '');

  if(!progress.mode){
    modeChoiceEl.style.display = 'block';
    listEl.innerHTML = '';
    document.getElementById('summaryBar').style.display = 'none';
    document.getElementById('examMeta').textContent = countText + '，請先選擇作答方式';
    return;
  }
  modeChoiceEl.style.display = 'none';
  document.getElementById('examMeta').textContent = countText + '・' +
    (progress.mode === 'immediate' ? '每題作答後立即看詳解' : '全部作答完再一起對答案');

  const shown = {};
  let html = '';
  data.questions.forEach(function(q){
    const qid = 'p' + q.id;
    const t = qType(q);
    const opts = optionsOf(q, data);
    html += sectionHtml(q);
    html += passageHtml(q, data, shown);
    html += '<div class="pcard" id="' + qid + '">';
    html += '  <div class="qhead2">';
    html += '    <div class="qnum">' + String(q.id).padStart(2,'0') + '</div>';
    html += '    <div class="qtext">' + typeTag(q) + q.text + '</div>';
    html += '  </div>';
    if(t === 'open'){
      html += '  <div class="open-wrap"><textarea class="open-input" id="open' + q.id + '" placeholder="在這裡作答…" oninput="openInput(' + q.id + ')"></textarea></div>';
      html += '  <button class="reveal-btn" id="revealBtn' + q.id + '" style="display:none;" onclick="revealOpen(' + q.id + ')">看參考答案與評分原則</button>';
    }else if(t === 'fill'){
      html += '  <div class="fill-wrap">';
      (q.fills||[]).forEach(function(f,i){
        html += '<label class="fill-row">' + (f.label ? '<span>' + f.label + '</span>' : '') +
                '<input type="text" class="fill-input" id="fill' + q.id + '_' + i + '" autocomplete="off" placeholder="' + (f.hint||'') +
                '" oninput="fillInput(' + q.id + ')"></label>';
      });
      html += '  </div>';
      html += '  <button class="confirm-btn" id="confirmBtn' + q.id + '" style="display:none;" onclick="confirmFill(' + q.id + ')">確認答案</button>';
    }else{
      if(t === 'multi') html += '  <div class="multi-hint">多選題：可選一個以上，選好後按「確認答案」。</div>';
      html += '  <div class="poptions">';
      Object.keys(opts).forEach(function(label){
        html += '<div class="poption" data-qid="' + q.id + '" data-label="' + label + '" onclick="pick(' + q.id + ',\'' + label + '\')">(' +
                label + ') ' + opts[label] + '</div>';
      });
      html += '  </div>';
      if(t === 'multi') html += '  <button class="confirm-btn" id="confirmBtn' + q.id + '" style="display:none;" onclick="confirmMulti(' + q.id + ')">確認答案</button>';
    }
    html += buildNotesHtml(q.id);
    html += '  <div class="presult" id="result' + q.id + '"></div>';
    html += '  <div class="psolution" id="sol' + q.id + '">' + solutionInner(q) + '</div>';
    html += '</div>';
  });
  listEl.innerHTML = html;

  data.questions.forEach(function(q){
    const a = progress.answers[q.id];
    const t = qType(q);
    if(t === 'open'){
      const ta = document.getElementById('open' + q.id);
      if(a && a.text) ta.value = a.text;
      refreshOpenUI(q);
      return;
    }
    if(t === 'fill'){
      if(a && a.vals) (q.fills||[]).forEach(function(f,i){ document.getElementById('fill' + q.id + '_' + i).value = a.vals[i] || ''; });
      if(a && isRevealed(q)) applyFillReveal(q);
      else if(!a && progress.submitted) revealUnanswered(q);
      else refreshFillUI(q);
      return;
    }
    if(!a){ if(progress.submitted) revealUnanswered(q); return; }
    if(isRevealed(q)) applyRevealUI(q);
    else applySelectedOnlyUI(q);
  });
  updateSummary(data);
}

function chosenSet(qid){
  const a = progress.answers[qid];
  return (a && a.selected) ? a.selected.split('') : [];
}

function pick(qid, label){
  if(progress.submitted) return;
  const q = findQ(qid);
  const t = qType(q);
  if(t === 'multi'){
    let a = progress.answers[qid];
    if(a && a.confirmed) return;
    const set = chosenSet(qid);
    const i = set.indexOf(label);
    if(i >= 0) set.splice(i,1); else set.push(label);
    if(set.length === 0){ delete progress.answers[qid]; }
    else{ progress.answers[qid] = { selected: sortedLetters(set.join('')), correct: null, confirmed: false }; }
    saveProgress();
    applySelectedOnlyUI(q);
    updateSummary(examData);
    return;
  }
  if(progress.mode === 'immediate'){
    if(progress.answers[qid]) return;
    progress.answers[qid] = { selected: label, correct: (label === q.answer) };
    saveProgress();
    applyRevealUI(q);
  }else{
    progress.answers[qid] = { selected: label, correct: null };
    saveProgress();
    applySelectedOnlyUI(q);
  }
  updateSummary(examData);
}

function confirmMulti(qid){
  const q = findQ(qid);
  const a = progress.answers[qid];
  if(!a || progress.mode !== 'immediate') return;
  a.confirmed = true;
  a.correct = (a.selected === sortedLetters(q.answer));
  saveProgress();
  applyRevealUI(q);
  updateSummary(examData);
}

function applySelectedOnlyUI(q){
  const card = document.getElementById('p' + q.id);
  const set = chosenSet(q.id);
  card.querySelectorAll('.poption').forEach(function(opt){
    opt.classList.toggle('selected', set.indexOf(opt.getAttribute('data-label')) >= 0);
  });
  const btn = document.getElementById('confirmBtn' + q.id);
  if(btn) btn.style.display = (progress.mode === 'immediate' && set.length) ? 'inline-block' : 'none';
}

function applyRevealUI(q){
  const card = document.getElementById('p' + q.id);
  const a = progress.answers[q.id];
  const set = a && a.selected ? a.selected.split('') : [];
  const right = q.answer.split('');
  const correct = !!a && sortedLetters(a.selected) === sortedLetters(q.answer);
  card.classList.add(correct ? 'correct' : 'wrong');

  card.querySelectorAll('.poption').forEach(function(opt){
    const label = opt.getAttribute('data-label');
    opt.onclick = null;
    opt.classList.remove('selected','correct-pick','wrong-pick','reveal-correct');
    const picked = set.indexOf(label) >= 0, isRight = right.indexOf(label) >= 0;
    if(picked && isRight) opt.classList.add('correct-pick');
    else if(picked && !isRight) opt.classList.add('wrong-pick');
    else if(!picked && isRight) opt.classList.add('reveal-correct');
  });
  const btn = document.getElementById('confirmBtn' + q.id);
  if(btn) btn.style.display = 'none';

  const resultEl = document.getElementById('result' + q.id);
  resultEl.classList.remove('right','wrong');
  resultEl.classList.add('show', correct ? 'right' : 'wrong');
  resultEl.textContent = correct ? '答對了！' : ('答錯了，正確答案是 ' + ansText(q) + partialNote(q, examData, a.selected));
  document.getElementById('sol' + q.id).classList.add('show');
}

/* ----- 選填題 ----- */
function fillVals(q){
  return (q.fills||[]).map(function(f,i){ return document.getElementById('fill' + q.id + '_' + i).value; });
}
function fillInput(qid){
  if(progress.submitted) return;
  const q = findQ(qid), vals = fillVals(q);
  if(vals.some(function(v){ return v.trim(); })){
    progress.answers[qid] = { vals: vals, correct: null, confirmed: false };
  }else{ delete progress.answers[qid]; }
  saveProgress();
  refreshFillUI(q);
  updateSummary(examData);
}
function refreshFillUI(q){
  const a = progress.answers[q.id];
  const btn = document.getElementById('confirmBtn' + q.id);
  if(btn) btn.style.display = (progress.mode === 'immediate' && a && !a.confirmed &&
    a.vals.every(function(v){ return v.trim(); })) ? 'inline-block' : 'none';
}
function confirmFill(qid){
  const q = findQ(qid), a = progress.answers[qid];
  if(!a || progress.mode !== 'immediate') return;
  a.confirmed = true;
  a.correct = fillOk(q, a.vals);
  saveProgress();
  applyFillReveal(q);
  updateSummary(examData);
}
function applyFillReveal(q){
  const card = document.getElementById('p' + q.id);
  const a = progress.answers[q.id];
  const correct = fillOk(q, a.vals);
  card.classList.add(correct ? 'correct' : 'wrong');
  (q.fills||[]).forEach(function(f,i){
    const inp = document.getElementById('fill' + q.id + '_' + i);
    inp.disabled = true;
    inp.classList.add(normFill(a.vals[i]) === normFill(f.answer) ? 'ok' : 'bad');
  });
  const btn = document.getElementById('confirmBtn' + q.id);
  if(btn) btn.style.display = 'none';
  const resultEl = document.getElementById('result' + q.id);
  resultEl.classList.remove('right','wrong');
  resultEl.classList.add('show', correct ? 'right' : 'wrong');
  resultEl.textContent = correct ? '答對了！' : ('答錯了，正確答案是 ' + fillAnsText(q) + '（選填題要全部空格都對才給分）');
  document.getElementById('sol' + q.id).classList.add('show');
}

/* 交卷後仍未作答的題目：直接顯示答案與詳解 */
function revealUnanswered(q){
  const card = document.getElementById('p' + q.id);
  card.classList.add('wrong');
  const resultEl = document.getElementById('result' + q.id);
  resultEl.classList.add('show','wrong');
  resultEl.textContent = '未作答，正確答案是 ' + ansText(q);
  document.getElementById('sol' + q.id).classList.add('show');
  card.querySelectorAll('.poption').forEach(function(opt){
    opt.onclick = null;
    if(q.answer.indexOf(opt.getAttribute('data-label')) >= 0 && qType(q) !== 'fill') opt.classList.add('reveal-correct');
  });
  card.querySelectorAll('.fill-input').forEach(function(i){ i.disabled = true; });
}

/* ----- 非選擇題 ----- */
function openInput(qid){
  const v = document.getElementById('open' + qid).value;
  if(v.trim()){
    const a = progress.answers[qid] || {};
    a.text = v;
    progress.answers[qid] = a;
  }else if(progress.answers[qid] && !progress.answers[qid].revealed){
    delete progress.answers[qid];
  }
  saveProgress();
  refreshOpenUI(findQ(qid));
  updateSummary(examData);
}
function refreshOpenUI(q){
  const a = progress.answers[q.id];
  const btn = document.getElementById('revealBtn' + q.id);
  const sol = document.getElementById('sol' + q.id);
  const reveal = isRevealed(q);
  if(btn) btn.style.display = (progress.mode === 'immediate' && !reveal) ? 'inline-block' : 'none';
  if(sol) sol.classList.toggle('show', reveal);
}
function revealOpen(qid){
  const a = progress.answers[qid] || {};
  a.revealed = true;
  progress.answers[qid] = a;
  saveProgress();
  refreshOpenUI(findQ(qid));
  updateSummary(examData);
}

function submitExam(){
  const g = gradable(examData);
  const answered = g.filter(function(q){ return progress.answers[q.id]; }).length;
  if(answered < g.length){
    if(!confirm(objLabel(examData) + '還有 ' + (g.length - answered) + ' 題沒作答，確定要交卷嗎？')) return;
  }
  examData.questions.forEach(function(q){
    if(qType(q) === 'open') return;
    const a = progress.answers[q.id];
    if(a){
      a.confirmed = true;
      a.correct = (qType(q) === 'fill') ? fillOk(q, a.vals) : (a.selected === sortedLetters(q.answer));
    }
  });
  progress.submitted = true;
  saveProgress();
  examData.questions.forEach(function(q){
    if(qType(q) === 'open') refreshOpenUI(q);
    else if(qType(q) === 'fill'){ if(progress.answers[q.id]) applyFillReveal(q); else revealUnanswered(q); }
    else if(progress.answers[q.id]) applyRevealUI(q);
    else revealUnanswered(q);
  });
  updateSummary(examData);
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateSummary(data){
  const g = gradable(data);
  const total = g.length;
  const answered = g.filter(function(q){ return progress.answers[q.id]; }).length;
  const correctCount = g.filter(function(q){ const a = progress.answers[q.id]; return a && a.correct === true; }).length;
  const bar = document.getElementById('summaryBar');
  bar.style.display = 'flex';
  document.getElementById('scoreText').textContent = objLabel(data) + '已作答 ' + answered + ' / ' + total;

  const submitBtn = document.getElementById('submitBtn');
  const detailText = document.getElementById('scoreDetailText');
  if(progress.mode === 'end' && !progress.submitted){
    detailText.textContent = '尚未對答案';
    submitBtn.style.display = 'inline-block';
  }else{
    detailText.textContent = objLabel(data) + '正確 ' + correctCount + ' 題';
    submitBtn.style.display = 'none';
  }
}

init();
</script>

</body>
</html>
