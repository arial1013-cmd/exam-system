<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練習模式 - 歷屆試題詳解系統</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="kicker" id="kicker">歷屆試題詳解系統・練習模式</div>
    <h1 id="examTitle">載入中…</h1>
    <div class="meta" id="examMeta"></div>
    <a class="backlink" href="index.html">← 回考卷清單</a>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <a class="btn" id="viewerLink" href="#">切換到詳解模式</a>
    <button onclick="resetProgress()">清除作答紀錄，重新開始</button>
  </div>

  <div id="modeChoice" style="display:none;" class="note">
    <div style="margin-bottom:12px; font-weight:700;">這份考卷要怎麼作答？</div>
    <div class="controls" style="margin:0;">
      <button class="primary" onclick="chooseMode('immediate')">每題作答後立即看詳解</button>
      <button class="primary" onclick="chooseMode('end')">全部作答完再一起對答案</button>
    </div>
  </div>

  <div id="questionList"><div class="empty-note">載入中…</div></div>

  <footer class="site-footer">
    教材製作／詳解撰寫：新竹市立成德高中 杜昀蓁<br>
    © 2026 版權所有，僅供教學使用，未經同意請勿轉載
  </footer>
</div>

<div class="summary-bar" id="summaryBar" style="display:none;">
  <div class="score" id="scoreText">已作答 0 / 0</div>
  <div id="scoreDetail" style="display:flex; align-items:center; gap:12px;">
    <span id="scoreDetailText">正確 0 題</span>
    <button id="submitBtn" style="display:none;" onclick="submitExam()">交卷對答案</button>
  </div>
</div>

<script>
let examId, examData, progress = { mode: null, submitted: false, answers: {} };

function getExamId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('exam');
}
function storageKey(){ return 'examPractice_' + examId; }

function loadProgress(){
  try{
    const raw = localStorage.getItem(storageKey());
    const parsed = raw ? JSON.parse(raw) : null;
    if(parsed && parsed.answers){
      progress = parsed;
    }else if(parsed){
      // legacy format from earlier version: flat {qid: {selected, correct}}
      progress = { mode: 'immediate', submitted: true, answers: parsed };
    }else{
      progress = { mode: null, submitted: false, answers: {} };
    }
  }catch(e){ progress = { mode: null, submitted: false, answers: {} }; }
}
function saveProgress(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(progress)); }catch(e){}
}
function resetProgress(){
  if(!confirm('確定要清除這份考卷的作答紀錄嗎？此動作無法復原。')) return;
  progress = { mode: null, submitted: false, answers: {} };
  saveProgress();
  renderExam(window._examMeta, examData);
}

async function init(){
  examId = getExamId();
  const listEl = document.getElementById('questionList');
  if(!examId){
    listEl.innerHTML = '<div class="empty-note">網址缺少 exam 參數，請從 <a href="index.html">考卷清單</a> 進入。</div>';
    return;
  }
  document.getElementById('viewerLink').href = 'viewer.html?exam=' + encodeURIComponent(examId);
  loadProgress();

  try{
    const manifestRes = await fetch('manifest.json');
    const manifest = await manifestRes.json();
    const examMeta = (manifest.exams || []).find(function(e){ return e.id === examId; });
    if(!examMeta){
      listEl.innerHTML = '<div class="empty-note">找不到考卷「' + examId + '」，請確認manifest.json中有登記。</div>';
      return;
    }
    window._examMeta = examMeta;
    const dataRes = await fetch(examMeta.dataFile);
    examData = await dataRes.json();
    renderExam(examMeta, examData);
  }catch(err){
    listEl.innerHTML = '<div class="empty-note">' +
      '載入考卷資料失敗。若是直接用瀏覽器打開檔案（file://），瀏覽器會擋掉JSON讀取，' +
      '請部署到網頁伺服器（例如GitHub Pages）後再開啟。</div>';
    console.error(err);
  }
}

function chooseMode(mode){
  progress.mode = mode;
  saveProgress();
  renderExam(window._examMeta, examData);
}

function renderExam(examMeta, data){
  const info = data.examInfo || {};
  document.title = (info.title || examMeta.title) + ' 練習';
  document.getElementById('kicker').textContent =
    (info.year||examMeta.year) + '學年度・' + (info.group||examMeta.group||'') + '・練習模式';
  document.getElementById('examTitle').textContent =
    (info.subject||examMeta.subject) + '（' + (info.code||examMeta.code||'') + '）練習';

  const modeChoiceEl = document.getElementById('modeChoice');
  const listEl = document.getElementById('questionList');

  if(!progress.mode){
    modeChoiceEl.style.display = 'block';
    listEl.innerHTML = '';
    document.getElementById('summaryBar').style.display = 'none';
    document.getElementById('examMeta').textContent = '共 ' + data.questions.length + ' 題，請先選擇作答方式';
    return;
  }
  modeChoiceEl.style.display = 'none';

  document.getElementById('examMeta').textContent =
    '共 ' + data.questions.length + ' 題・' +
    (progress.mode === 'immediate' ? '每題作答後立即看詳解' : '全部作答完再一起對答案');

  const revealAll = (progress.mode === 'immediate') || progress.submitted;
  const optionLabels = ['A','B','C','D'];
  let html = '';
  data.questions.forEach(function(q){
    const qid = 'p' + q.id;
    html += '<div class="pcard" id="' + qid + '">';
    html += '  <div class="qhead2">';
    html += '    <div class="qnum">' + String(q.id).padStart(2,'0') + '</div>';
    html += '    <div class="qtext">' + q.text + '</div>';
    html += '  </div>';
    html += '  <div class="poptions">';
    optionLabels.forEach(function(label){
      if(q.options[label] === undefined) return;
      html += '<div class="poption" data-qid="' + q.id + '" data-label="' + label + '" onclick="pick(' + q.id + ',\'' + label + '\')">(' +
              label + ') ' + q.options[label] + '</div>';
    });
    html += '  </div>';
    html += '  <div class="presult" id="result' + q.id + '"></div>';
    html += '  <div class="psolution" id="sol' + q.id + '">';
    html += '    <div class="label">詳解</div>';
    html += '    <ul class="steps">';
    (q.steps||[]).forEach(function(step){ html += '<li>' + step + '</li>'; });
    html += '    </ul>';
    if(q.final){ html += '<div class="final">' + q.final + '</div>'; }
    html += '  </div>';
    html += '</div>';
  });
  listEl.innerHTML = html;

  // restore previously chosen answers
  data.questions.forEach(function(q){
    const a = progress.answers[q.id];
    if(!a) return;
    if(revealAll){
      applyRevealUI(q, a.selected);
    }else{
      applySelectedOnlyUI(q, a.selected);
    }
  });

  updateSummary(data);
}

function pick(qid, label){
  if(progress.submitted) return; // locked after submit
  const q = examData.questions.find(function(x){ return x.id === qid; });

  if(progress.mode === 'immediate'){
    if(progress.answers[qid]) return; // already answered, locked
    const correct = (label === q.answer);
    progress.answers[qid] = { selected: label, correct: correct };
    saveProgress();
    applyRevealUI(q, label);
  }else{
    // end mode: allow changing selection until submit
    progress.answers[qid] = { selected: label, correct: null };
    saveProgress();
    applySelectedOnlyUI(q, label);
  }
  updateSummary(examData);
}

function applySelectedOnlyUI(q, selectedLabel){
  const card = document.getElementById('p' + q.id);
  const opts = card.querySelectorAll('.poption');
  opts.forEach(function(opt){
    opt.classList.remove('selected');
    if(opt.getAttribute('data-label') === selectedLabel){
      opt.classList.add('selected');
    }
  });
}

function applyRevealUI(q, selectedLabel){
  const card = document.getElementById('p' + q.id);
  const correct = selectedLabel === q.answer;
  card.classList.add(correct ? 'correct' : 'wrong');

  const opts = card.querySelectorAll('.poption');
  opts.forEach(function(opt){
    const label = opt.getAttribute('data-label');
    opt.onclick = null;
    opt.classList.remove('selected');
    if(label === selectedLabel && label === q.answer){
      opt.classList.add('correct-pick');
    }else if(label === selectedLabel && label !== q.answer){
      opt.classList.add('wrong-pick');
    }else if(label === q.answer){
      opt.classList.add('reveal-correct');
    }
  });

  const resultEl = document.getElementById('result' + q.id);
  resultEl.classList.add('show', correct ? 'right' : 'wrong');
  resultEl.textContent = correct ? '答對了！' : ('答錯了，正確答案是 (' + q.answer + ')');

  document.getElementById('sol' + q.id).classList.add('show');
}

function submitExam(){
  const total = examData.questions.length;
  const answered = Object.keys(progress.answers).length;
  if(answered < total){
    if(!confirm('還有 ' + (total - answered) + ' 題沒作答，確定要交卷嗎？')) return;
  }
  // grade everything
  examData.questions.forEach(function(q){
    const a = progress.answers[q.id];
    if(a){
      a.correct = (a.selected === q.answer);
      applyRevealUI(q, a.selected);
    }
  });
  progress.submitted = true;
  saveProgress();
  updateSummary(examData);
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateSummary(data){
  const total = data.questions.length;
  const answered = Object.keys(progress.answers).length;
  const correctCount = Object.values(progress.answers).filter(function(p){ return p.correct === true; }).length;
  const bar = document.getElementById('summaryBar');
  bar.style.display = 'flex';
  document.getElementById('scoreText').textContent = '已作答 ' + answered + ' / ' + total;

  const submitBtn = document.getElementById('submitBtn');
  const detailText = document.getElementById('scoreDetailText');

  if(progress.mode === 'end' && !progress.submitted){
    detailText.textContent = '尚未對答案';
    submitBtn.style.display = 'inline-block';
  }else{
    detailText.textContent = '正確 ' + correctCount + ' 題';
    submitBtn.style.display = 'none';
  }
}

init();
</script>

</body>
</html>
